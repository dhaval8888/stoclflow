services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow_dev_password_123
      POSTGRES_DB: stockflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./stockflow-api
      dockerfile: Dockerfile
    container_name: stockflow-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://stockflow:stockflow_dev_password_123@postgres:5432/stockflow_db
      JWT_ACCESS_SECRET: stockflow_access_secret_replace_in_production_min_32_chars
      JWT_REFRESH_SECRET: stockflow_refresh_secret_replace_in_production_min_32_chars
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
